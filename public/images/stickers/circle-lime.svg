<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- A light top edge and deeper base preserve the saturated lime. -->
    <linearGradient id="lighting" x1="0" y1="0" x2="0" y2="1" gradientTransform="rotate(-4 .5 .5)">
      <stop stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".40" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#C7F51F" stroke="#fffef8" stroke-width="4"/>
  <circle cx="64" cy="64" r="58" fill="url(#lighting)"/>
</svg>
